name: Rust preview

on:
  workflow_dispatch:
  push:
    paths: ['rust/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'scripts/package-rust.py', 'tests/test_rust_package.py', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'scripts/package-rust.py', 'tests/test_rust_package.py', '.github/workflows/rust.yml']

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo test --locked -p hardtime-core
      - run: cargo clippy --locked -p hardtime-core --all-targets -- -D warnings
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo test --locked -p hardtime-core
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked -p hardtime-rust
      - run: python scripts/package-rust.py
      - run: python tests/test_rust_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hard-Time-Rust-preview
          path: |
            dist/Hard-Time-Rust-preview.zip
            dist/Hard-Time-Rust-preview.sha256
          if-no-files-found: error
