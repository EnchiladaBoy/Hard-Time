[workspace]
members = ["rust/core", "rust/game"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
