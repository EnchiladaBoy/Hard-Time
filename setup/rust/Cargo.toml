[package]
name = "hardtime-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Keep installer builds independent of the game engine and its dependency graph.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL",
    "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "hardtime-setup"
path = "src/main.rs"

[[bin]]
name = "hardtime-launcher"
path = "src/launcher.rs"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
